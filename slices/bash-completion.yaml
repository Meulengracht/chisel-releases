package: bash-completion

essential:
  - bash-completion_copyright

slices:
  core:
    essential:
      - bash-completion_bins
      - bash-completion_config
      - bash-completion_completions

  bins:
    contents:
      /usr/bin/dh_bash-completion:

  config:
    contents:
      /etc/profile.d/bash_completion.sh:
      /etc/bash_completion:

  completions:
    contents:
      /usr/share/bash-completion/bash_completion:
      /usr/share/bash-completion/completions/*:

  copyright:
    contents:
      /usr/share/doc/bash-completion/copyright:
