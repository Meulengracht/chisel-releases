package: kmod

essential:
  - kmod_copyright

slices:
  core:
    essential:
      - kmod_bins
      - kmod_config
      - kmod_completions
      - kmod_init-d

  bins:
    essential:
      - libc6_libs
    contents:
      /usr/bin/kmod:
      /usr/bin/lsmod:
      /usr/sbin/depmod:
      /usr/sbin/insmod:
      /usr/sbin/lsmod:
      /usr/sbin/modinfo:
      /usr/sbin/modprobe:
      /usr/sbin/rmmod:
  
  config:
    essential:
      - kmod_modprobe-d
    contents:
      /etc/depmod.d/ubuntu.conf:
      /usr/lib/modprobe.d/aliases.conf:

  completions:
    contents:
      /usr/share/bash-completion/completions/kmod:

  init-d:
    contents:
      /etc/init.d/kmod:

  initramfs-tools:
    contents:
      /usr/share/initramfs-tools/hooks/kmod:

  modprobe-d:
    contents:
      /etc/modprobe.d/blacklist-ath_pci.conf:
      /etc/modprobe.d/blacklist-firewire.conf:
      /etc/modprobe.d/blacklist-framebuffer.conf:
      /etc/modprobe.d/blacklist-rare-network.conf:
      /etc/modprobe.d/blacklist.conf:
      /etc/modprobe.d/iwlwifi.conf:

  copyright:
    contents:
      /usr/share/doc/kmod/copyright:
